<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNC Data Science & AI Mastery Platform | 90-Day Production & Interview Roadmap</title>
  <meta name="description" content="Production-Ready Learning Platform for Python, Machine Learning, SQL, Big Data, and Generative AI tailored for top MNC technical interview preparation.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Pyodide Python Runner for Browser Execution -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Fixed Application Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">
        <i data-lucide="menu"></i>
      </button>
      <div class="app-logo">
        <i data-lucide="terminal"></i>
        <span>MNC DS & AI Mastery</span>
      </div>
    </div>

    <!-- Global Search Bar -->
    <div class="search-container">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" id="global-search-input" placeholder="Search 74+ topics, syntax, interview Qs, or functions... (Press '/' to focus)" />
    </div>

    <div class="header-right">
      <!-- Global Learning Progress Bar -->
      <div class="global-progress-box">
        <div class="progress-label-group">
          <span>Overall Mastery</span>
          <span id="global-progress-text">0% Complete</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="global-progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Theme Switcher Button -->
      <button class="theme-toggle-btn" onclick="App.toggleTheme()" title="Toggle Dark/Light Mode">
        <i data-lucide="sun" id="theme-toggle-icon"></i>
      </button>
    </div>
  </header>

  <!-- Main Grid App Layout -->
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav-items">
        <!-- Rendered dynamically by app.js -->
      </nav>
    </aside>

    <!-- Main Content Rendering Area -->
    <main class="main-content" id="main-content-view">
      <!-- Dynamic Views (Subject Grid, Topic Details, Interview Suite, Roadmap, Playground) -->
    </main>

  </div>

  <!-- Schema Data Engine -->
  <script src="js/data/schema.js"></script>

  <!-- Core Data Modules -->
  <script src="js/data/python_data.js"></script>
  <script src="js/data/genai_data.js"></script>
  <script src="js/data/ml_data.js"></script>
  <script src="js/data/bigdata_data.js"></script>
  <script src="js/data/sql_data.js"></script>
  <script src="js/data/roadmap_data.js"></script>

  <!-- Execution Engine & Database Persistence -->
  <script src="js/db.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
